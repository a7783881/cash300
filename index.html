<script>
(() => {

  // provenance markers (non-intrusive)
  const __A = "Jake (Min)";
  const __S = "Y2FzaDMwMHx2NnwyMDI2LTAyLTIyfEpha2UgKE1pbik="; // base64-ish build tag
  try{
    const m = document.querySelector('meta[name="author"]')?.content || "";
    const bd = document.body?.dataset?.author || "";
    const ok = (m.includes("Jake") && bd.includes("Jake"));
    if(!ok){
      console.warn("[cash300] signature mismatch");
    }else{
      console.debug("[cash300] " + __A + " | " + __S);
      // store a soft marker to survive simple copy/paste edits
      if (window.localStorage){
        localStorage.setItem("cash300_prov", __A + "|" + __S);
      }
    }
  }catch(e){}

  /*
    Internal marker (not shown on UI):
    Author: Min
    (Anyone who views source can still see it.)
  */

  
  


const ALL_DENOMS = [
  { key:"100",  label:"$100",  cents: 10000 },
  { key:"50",   label:"$50",   cents: 5000 },
  { key:"20",   label:"$20",   cents: 2000 },
  { key:"10",   label:"$10",   cents: 1000 },
  { key:"5",    label:"$5",    cents: 500 },
  { key:"2",    label:"$2",    cents: 200 },
  { key:"1",    label:"$1",    cents: 100 },
  { key:"0.25", label:"$0.25", cents: 25 },
  { key:"0.10", label:"$0.10", cents: 10 },
  { key:"0.05", label:"$0.05", cents: 5 },
];

const CALC_DENOMS = [
  { key:"20",   label:"$20",   cents: 2000 },
  { key:"10",   label:"$10",   cents: 1000 },
  { key:"5",    label:"$5",    cents: 500 },
  { key:"2",    label:"$2",    cents: 200 },
  { key:"1",    label:"$1",    cents: 100 },
  { key:"0.25", label:"$0.25", cents: 25 },
  { key:"0.10", label:"$0.10", cents: 10 },
  { key:"0.05", label:"$0.05", cents: 5 },
];

  
  const INPUT_LABELS = {
  "100": "$100",
  "50": "$50",
  "20": "$20",
  "10": "$10",
  "5": "$5",
  "2": "$2",
  "1": "$1",
  "0.25": "$0.25",
  "0.10": "$0.10",
  "0.05": "$0.05"
};

  const TARGET_CENTS = 30000;
  const BASE_LOCK = [
    { key:"20", count: 3 },
    { key:"10", count: 6 },
  ];

  
  const SCORE_KEYS = ["0.05","0.10","0.25","1","2","5","10","20"];

  const $ = (sel) => document.querySelector(sel);
  const invGrid = $("#invGrid");
  const statusEl = $("#status");
  const tbody = $("#resultTable tbody");
  const grandTotalEl = $("#grandTotal");
  const explainEl = $("#explain");
  const summaryEl = $("#summary");

  // Hidden watermark string (not displayed)
  const __wm = ["Au","thor",": ","Min"].join("");

  function buildInputs(){
    invGrid.innerHTML = "";
    for (const d of ALL_DENOMS){
      const id = "inv_" + d.key.replace(".","_");

      const lab = document.createElement("label");
      lab.setAttribute("for", id);
      lab.textContent = INPUT_LABELS[d.key] ?? d.key;

      const inp = document.createElement("input");
      
      
      inp.type = "text";
      inp.inputMode = "numeric";
      inp.pattern = "[0-9]*";
      inp.autocomplete = "off";
      inp.id = id;

      inp.placeholder = "0";
      inp.value = "";

      function sanitize(){
        
        let s = inp.value.replace(/\D+/g, "");
        
        s = s.replace(/^0+(?=\d)/, "");
        inp.value = s;
      }

      inp.addEventListener("focus", () => inp.select());

      
      inp.addEventListener("input", () => {
        sanitize();
        scheduleAutoCalc();
      });

      
      inp.addEventListener("blur", () => {
        sanitize();
        const raw = inp.value.trim();
        const v = raw === "" ? 0 : Number(raw);
        if (!raw || !Number.isFinite(v) || v <= 0) inp.value = "";
      });

      invGrid.appendChild(lab);
      invGrid.appendChild(inp);
    }
  }

  function readInv(){
    const inv = {};
    for (const d of ALL_DENOMS){
      const id = "inv_" + d.key.replace(".","_");
      const raw = document.getElementById(id).value.trim();
      const v = raw === "" ? 0 : Number(raw);
      inv[d.key] = Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
    }
    return inv;
  }

  function resetToDefault(){
    for (const d of ALL_DENOMS){
      const id = "inv_" + d.key.replace(".","_");
      document.getElementById(id).value = "";
    }
  }

  function money(cents){ return (cents / 100).toFixed(2); }
  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  
  function betterCandidate(c, cur){
    for (let i = 0; i <= 5; i++){
      if (c[i] !== cur[i]) return c[i] > cur[i];
    }
    for (let i = 6; i <= 7; i++){
      if (c[i] !== cur[i]) return c[i] < cur[i];
    }
    return false;
  }

  function makeItems(inv){
    const items = [];
    for (const d of CALC_DENOMS){
      const cnt = inv[d.key] ?? 0;
      if (cnt <= 0) continue;

      let k = 1;
      let left = cnt;
      while (left > 0){
        const take = Math.min(k, left);
        left -= take;
        k <<= 1;

        const idx = SCORE_KEYS.indexOf(d.key);
        items.push({ value: d.cents * take, idx, take });
      }
    }
    return items;
  }

  function solvePreferSmallBest(amountCents, inv){
    amountCents = amountCents - (amountCents % 5);
    if (amountCents < 0) amountCents = 0;

    const items = makeItems(inv);

    const reachable = new Uint8Array(amountCents + 1);
    const c0 = new Int32Array(amountCents + 1);
    const c1 = new Int32Array(amountCents + 1);
    const c2 = new Int32Array(amountCents + 1);
    const c3 = new Int32Array(amountCents + 1);
    const c4 = new Int32Array(amountCents + 1);
    const c5 = new Int32Array(amountCents + 1);
    const c6 = new Int32Array(amountCents + 1);
    const c7 = new Int32Array(amountCents + 1);

    reachable[0] = 1;

    for (const it of items){
      const v = it.value;
      if (v > amountCents) continue;

      for (let s = amountCents; s >= v; s--){
        if (!reachable[s - v]) continue;

        const cand = [
          c0[s - v], c1[s - v], c2[s - v], c3[s - v],
          c4[s - v], c5[s - v], c6[s - v], c7[s - v],
        ];
        if (it.idx >= 0) cand[it.idx] += it.take;

        if (!reachable[s]){
          reachable[s] = 1;
          c0[s]=cand[0]; c1[s]=cand[1]; c2[s]=cand[2]; c3[s]=cand[3];
          c4[s]=cand[4]; c5[s]=cand[5]; c6[s]=cand[6]; c7[s]=cand[7];
        } else {
          const cur = [c0[s],c1[s],c2[s],c3[s],c4[s],c5[s],c6[s],c7[s]];
          if (betterCandidate(cand, cur)){
            c0[s]=cand[0]; c1[s]=cand[1]; c2[s]=cand[2]; c3[s]=cand[3];
            c4[s]=cand[4]; c5[s]=cand[5]; c6[s]=cand[6]; c7[s]=cand[7];
          }
        }
      }
    }

    let bestSum = -1;
    if (reachable[amountCents]) bestSum = amountCents;
    else {
      for (let s = amountCents; s >= 0; s -= 5){
        if (reachable[s]) { bestSum = s; break; }
      }
    }
    if (bestSum < 0) return null;

    const counts = {
      "0.05": c0[bestSum],
      "0.10": c1[bestSum],
      "0.25": c2[bestSum],
      "1":    c3[bestSum],
      "2":    c4[bestSum],
      "5":    c5[bestSum],
      "10":   c6[bestSum],
      "20":   c7[bestSum],
    };

    return { sumCents: bestSum, counts, exact: (bestSum === amountCents) };
  }

  
  function solveAnyExact(amountCents, inv){
    amountCents = amountCents - (amountCents % 5);
    if (amountCents < 0) amountCents = 0;

    const items = [];
    for (const d of CALC_DENOMS){
      const cnt = inv[d.key] ?? 0;
      if (cnt <= 0) continue;

      let k = 1;
      let left = cnt;
      while (left > 0){
        const take = Math.min(k, left);
        left -= take;
        k <<= 1;
        items.push({ value: d.cents * take, key: d.key, take });
      }
    }

    const reachable = new Uint8Array(amountCents + 1);
    const prevSum = new Int32Array(amountCents + 1);
    const prevItem = new Int32Array(amountCents + 1);
    prevSum.fill(-1);
    prevItem.fill(-1);
    reachable[0] = 1;

    for (let i = 0; i < items.length; i++){
      const it = items[i];
      const v = it.value;
      if (v > amountCents) continue;

      for (let s = amountCents; s >= v; s--){
        if (reachable[s]) continue;
        if (!reachable[s - v]) continue;
        reachable[s] = 1;
        prevSum[s] = s - v;
        prevItem[s] = i;
      }
      if (reachable[amountCents]) break;
    }

    if (!reachable[amountCents]) return null;

    const counts = Object.fromEntries(CALC_DENOMS.map(d => [d.key, 0]));
    let cur = amountCents;
    while (cur > 0){
      const i = prevItem[cur];
      if (i < 0) break;
      const it = items[i];
      counts[it.key] += it.take;
      cur = prevSum[cur];
    }
    return counts;
  }

  function compute(){
    const originalInv = readInv();
    let inv = { ...originalInv };
    const used = Object.fromEntries(ALL_DENOMS.map(d => [d.key, 0]));
    const log = [];

    function denomCents(key){
      const d = ALL_DENOMS.find(x => x.key === key);
      return d ? d.cents : 0;
    }

    function take(key, n){
      const can = Math.min(inv[key] ?? 0, n);
      inv[key] = (inv[key] ?? 0) - can;
      used[key] = (used[key] ?? 0) + can;
      return can;
    }

    
    let baseCents = 0;
    for (const b of BASE_LOCK){
      const got = take(b.key, b.count);
      baseCents += got * denomCents(b.key);
      if (got < b.count) log.push(`保底不足：${b.key} 需要 ${b.count}，實拿 ${got}。`);
    }

    const remainingTarget = TARGET_CENTS - baseCents;
    if (remainingTarget < 0){
      return { level:"bad", message:"保底已超過 300，請檢查設定。", used, explain:"" };
    }

    const pref = solvePreferSmallBest(remainingTarget, inv);
    if (!pref){
      const totalCents = baseCents;
      return { level:"bad", message:`庫存不足：保底後仍無法再組出任何金額。總計 ${money(totalCents)}。`, used, explain:"" };
    }

    
    for (const k of Object.keys(pref.counts)){
      const cnt = pref.counts[k] ?? 0;
      if (cnt > 0) take(k, cnt);
    }

    let totalCents = baseCents + pref.sumCents;

    
    if (totalCents !== TARGET_CENTS){
      inv = { ...originalInv };
      for (const b of BASE_LOCK){
        const can = Math.min(inv[b.key] ?? 0, b.count);
        inv[b.key] = (inv[b.key] ?? 0) - can;
      }
      const exactCounts = solveAnyExact(remainingTarget, inv);
      if (exactCounts){
        const rebuilt = Object.fromEntries(CALC_DENOMS.map(d => [d.key, 0]));
        for (const b of BASE_LOCK){
          rebuilt[b.key] += Math.min(originalInv[b.key] ?? 0, b.count);
        }
        for (const d of CALC_DENOMS){
          rebuilt[d.key] += (exactCounts[d.key] ?? 0);
        }
        let sum = 0;
        for (const d of CALC_DENOMS) sum += rebuilt[d.key] * d.cents;
        if (sum === TARGET_CENTS){
          for (const d of CALC_DENOMS) used[d.key] = rebuilt[d.key];
          totalCents = sum;
          log.push("已啟用保底保險：為了湊到 300.00，放寬了部分小面額偏好。");
        }
      }
    }

    const exact300 = (totalCents === TARGET_CENTS);
    let level = "ok";
    let message = "已精準湊到 300.00，並盡量多保留 0.05/0.10/0.25。";
    if (!exact300){
      level = "warn";
      message = `⚠️ 真的湊不到 300.00：已取最大可達且不超過。總計 ${money(totalCents)}（差 ${money(TARGET_CENTS - totalCents)}）。`;
    }

    const explain = [
  `保底：20×${used["20"]}、10×${used["10"]}（不足則依庫存）。`,
  `偏好：先最大化 0.05 → 0.10 → 0.25 → 1 → 2 → 5（盡量少用 10/20）。`,
  `結果：0.05×${used["0.05"]}、0.10×${used["0.10"]}、0.25×${used["0.25"]}。`,
  `注意：$50 / $100 不會納入「湊 300」計算，只會算進每日現金總額。`
].join("<br>");

    return { level, message, used, explain };
  }

  function render(res){
    statusEl.className = "status " + (res.level === "ok" ? "ok" : res.level === "warn" ? "warn" : "bad");
    statusEl.textContent = res.message;

    const invInput = readInv();
    tbody.innerHTML = "";
    let sum = 0;            
    let invSum = 0;         
    let remainSum = 0;      
    let invPieces = 0;      
    let remainPieces = 0;   

    for (const d of ALL_DENOMS){
      const invCnt = invInput[d.key] ?? 0;
      const useCnt = res.used?.[d.key] ?? 0;
      const subtotal = useCnt * d.cents;
      sum += subtotal;

      const invSubtotal = invCnt * d.cents;
      invSum += invSubtotal;
      invPieces += invCnt;

      const remainCnt = Math.max(0, invCnt - useCnt);
      remainSum += remainCnt * d.cents;
      remainPieces += remainCnt;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="mono">${d.label}</td>
        <td class="mono">${invCnt}</td>
        <td class="mono"><b>${useCnt}</b></td>
        <td class="mono">${remainCnt}</td>
        <td class="mono">${money(subtotal)}</td>
      `;
      tbody.appendChild(tr);
    }

    grandTotalEl.textContent = money(sum);
    explainEl.innerHTML = res.explain ?? "";

    
    summaryEl.innerHTML = [
      `總金額：$${money(invSum)}（${invPieces}）`,
      `零用金：$${money(sum)}（${invPieces - remainPieces}）`,
      `每日現金：$${money(remainSum)}（${remainPieces}）`,
    ].join("<br>");
  }

  
  let calcTimer = null;
  let isRunning = false;

  function scheduleAutoCalc(){
    if (calcTimer) clearTimeout(calcTimer);
    calcTimer = setTimeout(runAutoCalcSafely, 320);
  }

  function runAutoCalcSafely(){
    if (isRunning){
      if (calcTimer) clearTimeout(calcTimer);
      calcTimer = setTimeout(runAutoCalcSafely, 220);
      return;
    }
    isRunning = true;
    try{
      render(compute());
    } finally {
      isRunning = false;
    }
  }

  function resetAll(){
    resetToDefault();
    statusEl.className = "status bad";
    statusEl.textContent = "已重置為預設（全部視為 0，且 0 不顯示）。";
    tbody.innerHTML = "";
    grandTotalEl.textContent = "0.00";
    explainEl.textContent = "";
    summaryEl.textContent = "";
  }

  buildInputs();
  resetToDefault();
  $("#btnClear").addEventListener("click", resetAll);
})();
</script>
</body>
</html>
